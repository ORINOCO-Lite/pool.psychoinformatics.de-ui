# --------------------
# General app settings
# --------------------
app_name: PsyInf Knowledge Pooling Tool
documentation_url: ''
external_config_url: https://hub.psychoinformatics.de/datalink/assets/raw/branch/main/shacl-vue/config_default_xyzri.yaml
page_title: PsyInf Knowledge
source_code_url: https://hub.psychoinformatics.de/www/pool.psychoinformatics.de-ui

# -------
# Content
# -------
content:
  DocumentUploadTemplate:
    url: DocumentUploadTemplate.ttl

# --------------
# Theme settings
# --------------
app_theme:
  link_color: '#ffa200'
  hover_color: '#ffa200'
  active_color: '#ffa201'
  visited_color: '#ffa201'
  panel_color: '#333333'
  logo: logo.png

# --------------------------
# Application inputs sources
# --------------------------
# All from external_config_url

# -------------------
# Identifier settings
# -------------------
# All from external_config_url

# ------------
# UI behaviour
# ------------
component_config:
  InstancesUploadEditor:
    dlthings:Thing:
      pid_template: datalad:aa2b2132-f3f1-4d62-b245-d9717722897e/uuid/{_randomUUID}
      ttl_template: content:DocumentUploadTemplate
filter_records_by:
  - dlthings:short_name
show_classes:
  - https://concepts.datalad.org/s/things/unreleased/AnnotationTag
  - https://concepts.datalad.org/s/things/unreleased/Rule
  - https://concepts.datalad.org/s/things/unreleased/Property
  - https://concepts.datalad.org/s/things/unreleased/Convention

# -----------------------
# Service API integration
# -----------------------
service_base_url:
  - url: https://pool.psychoinformatics.de/api/protected/
    type: write
  - url: https://pool.psychoinformatics.de/api/public/
    type: read
service_fetch_before:
  get-record: []
  get-records: []
token_info: Please contact Michael Hanke at m.hanke@fz-juelich.de for credentials.
token_info_url: ''
use_service: true
use_token: true

# ----------------
# Special features
# ----------------
gitannex_p2phttp_config:
  base_url: https://hub.psychoinformatics.de/git-annex-p2phttp/git-annex
  annex_uuid: f1a8ef1c-6d8a-40e3-970f-4634390d961f
  client_uuid: 2e7a7d75-f2ed-11f0-90a9-dc97ba1c2528
use_gitannex_p2phttp: true
