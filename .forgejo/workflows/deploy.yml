name: Deploy on webserver

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: forgejo.repository == 'www/pool.psychoinformatics.de-ui'
    name: Build site and deploy
    runs-on: site-deploy
    container:
      volumes:
        # for depositing the built site directly
        - /home/www/srv:/www:rw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make all

      - name: Test built files
        run: |
          find dist

      - name: Deploy
        run: cp -r dist /www/pool.psychoinformatics.de-new && (test -d && mv /www/pool.psychoinformatics.de /www/pool.psychoinformatics.de-old || true); mv /www/pool.psychoinformatics.de-new /www/pool.psychoinformatics.de; rm -rf /www/pool.psychoinformatics.de-old
