name: Deploy on webserver

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: forgejo.repository == 'www/pool.psychoinformatics.de-ui'
    name: Build site and deploy
    runs-on: site-deploy
    container:
      volumes:
        # for depositing the built site directly
        - /home/www/srv:/www:rw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Provision `uv`
        run: wget -qO- https://astral.sh/uv/install.sh | sh

      - name: Provision `jq`
        run: wget https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -O /usr/local/bin/jq && chmod +x /usr/local/bin/jq

      - name: Provision `yq`
        run: uv tool install yq

      - name: Build
        run: make install build

      - name: Package
        run: |
          # we need to have the editor served from a `ui/` path
          mkdir deploy
          mv dist deploy/ui

      - name: Deploy
        run: cp -r deploy /www/pool.psychoinformatics.de-new && (test -d && mv /www/pool.psychoinformatics.de /www/pool.psychoinformatics.de-old || true); mv /www/pool.psychoinformatics.de-new /www/pool.psychoinformatics.de; rm -rf /www/pool.psychoinformatics.de-old
